<!DOCTYPE html>
<html lang="en">
    <head>
        <link rel="stylesheet" href="Digitalclock.css" />
        <title>Digitalclock</title>
    </head>
    <body>
        <div class="digital-clock">
            <div class="week">
                <div class="active">SUN</div>
                <div>MON</div>
                <div>TUE</div>
                <div>WED</div>
                <div>THU</div>
                <div>FRI</div>
                <div>SAT</div>  
            </div>
            <div class="time">
                <div class="hour">12</div>
                <div class="dot">:</div>
                <div class="min">05</div>
                <div class="dot">:</div> 
                <div class="sec">30</div> 
            </div>
        </div>
        <script src="Digitalclock.js"></script>
    </body>
</html>
